<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrochetPARADE harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7;
        --fg: #1f1d1a;
        --muted: #6d6860;
        --line: #d9d4ca;
        --ok: #2f7d4f;
        --bad: #b3372b;
        --yarn: #3d64b3;
        --attach: #c0503c;
        --node: #1f1d1a;
        /* Symbol mode reads the app's tokens. */
        --ink: var(--fg);
        --ink-alt: #2f63a8;
        --card: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1a18;
          --fg: #ece8e1;
          --muted: #a19b91;
          --line: #3a3732;
          --ok: #6cc28e;
          --bad: #ec7a6c;
          --yarn: #7fa2e6;
          --attach: #e58a76;
          --node: #ece8e1;
          --ink-alt: #8fb6ee;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
      @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
      h1 { font-size: 16px; margin: 0 0 8px; }
      textarea { width: 100%; height: 200px; font: 13px/1.4 ui-monospace, monospace; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
      select, input, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
      input[type="number"] { width: 72px; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { font-weight: 600; }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      td, th { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; }
      .muted { color: var(--muted); }
      progress { width: 160px; }
      #view { position: relative; width: 100%; height: min(72vh, 680px); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #tooltip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font-size: 12px; white-space: nowrap; }
      .key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 2px 0 6px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>CrochetPARADE: validate and lay out</h1>
        <label class="muted" for="pattern">CrochetPARADE text</label>
        <textarea id="pattern" spellcheck="false"></textarea>
        <div class="controls">
          <select id="example" aria-label="Example"></select>
          <select id="dimension" aria-label="Dimension">
            <option value="3">3D</option>
            <option value="2">2D</option>
          </select>
        </div>
        <p><span id="status">…</span> <span id="parseTime" class="muted"></span></p>
        <p id="message"></p>
        <table id="rows"></table>
      </section>
      <section>
        <div class="controls">
          <label>seed <input id="seed" type="number" min="0" placeholder="auto" title="Blank uses the pattern's DOT: start= (default 0)" /></label>
          <label>iterations <input id="iterations" type="number" min="10" step="50" placeholder="auto" title="Blank uses the pattern's DOT: iterations= (default 500)" /></label>
          <button id="layout">Lay out</button>
          <button id="cancel" disabled>Cancel</button>
          <progress id="progress" max="1" value="0"></progress>
          <span id="layoutInfo" class="muted"></span>
        </div>
        <div class="controls">
          <label>view
            <select id="viewMode">
              <option value="structure">structure</option>
              <option value="symbols">symbols</option>
            </select>
          </label>
          <label>colour
            <select id="colorMode">
              <option value="yarn">yarn</option>
              <option value="type">stitch type</option>
              <option value="ink">ink (symbols)</option>
              <option value="rows">alternate rows (symbols)</option>
            </select>
          </label>
          <label><input id="internal" type="checkbox" /> internal nodes</label>
          <button id="fit">Fit</button>
          <span class="muted">
            <span class="key" style="background: var(--yarn)"></span>yarn
            <span class="key" style="background: var(--attach)"></span>worked into
            <span class="key" style="background: #ff3fd2"></span>hovered
            <span class="key" style="background: #2fbf71"></span>its base
          </span>
        </div>
        <div id="view"><div id="tooltip" hidden></div></div>
      </section>
    </main>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
